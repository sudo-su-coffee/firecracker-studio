# Firecracker Studio remote web-console configuration.
# Copy to the configured state directory as config.toml.

app_name = "firecracker-studio"
listen = "127.0.0.1:7822"
public_url = "https://studio.example.com"
state_dir = "/var/lib/firecracker-studio"
artifact_dir = "/var/lib/firecracker-studio/artifacts"
operation_retention = "24h"
worker_timeout = "30s"
operation_timeout = "30m"
firecracker_api_timeout = "30s"
operation_workers = 2
guest_agent_port = 5000
guest_agent_cid = 3
network_cidr = "172.16.0.0/16"

[admin]
username = "admin"
email = "admin@example.com"
# Store a bcrypt password hash here. Never store the plaintext password.
password_hash = "$2a$12$replace-with-a-bcrypt-hash"

[notifications]
enabled = false
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_username = "studio@example.com"
smtp_password_file = "/etc/firecracker-studio/smtp-password"
# If smtp_password_file is set, its contents are loaded at startup.
from = "studio@example.com"
recipients = ["admin@example.com"]
