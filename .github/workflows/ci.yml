name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: git diff --check

  frontend:
    name: Vue production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  web-binary:
    name: Embedded Vue web binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Copy Vue assets into Go embed directory
        run: rm -rf internal/web/dist && mkdir -p internal/web/dist && cp -R frontend/dist/. internal/web/dist/
      - run: go build -trimpath -ldflags "-s -w" -o firecracker-studio-linux-amd64 ./cmd/firecracker-studio
      - name: Validate embedded web binary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s firecracker-studio-linux-amd64
          grep -a -q 'Firecracker Studio' firecracker-studio-linux-amd64
          sha256sum firecracker-studio-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-studio-linux-amd64
          path: firecracker-studio-linux-amd64
