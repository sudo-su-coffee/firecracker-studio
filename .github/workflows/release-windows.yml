name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.5.0
        required: true
        type: string
      publish:
        description: Publish the GitHub release after build validation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows desktop release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Go tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build Windows application
        shell: pwsh
        run: wails build -clean -platform windows/amd64 -nsis -ldflags "-X main.version=${{ inputs.version }}"

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/bin -File
          $files | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File build/bin/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-studio-${{ inputs.version }}-windows
          path: |
            build/bin/*.exe
            build/bin/SHA256SUMS.txt

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Firecracker Studio ${{ inputs.version }}
          generate_release_notes: true
          files: |
            build/bin/*.exe
            build/bin/SHA256SUMS.txt
