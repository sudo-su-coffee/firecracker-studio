name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.5.0
        required: true
        type: string
      publish:
        description: Publish the GitHub release after build validation
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows desktop release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Go tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Validate and normalize release version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ($version -notmatch '^v?\d+\.\d+\.\d+$') { throw "Version must match vMAJOR.MINOR.PATCH, for example v1.0.0" }
          $numeric = $version.TrimStart('v')
          "RELEASE_VERSION=$numeric" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          $goBin = go env GOPATH
          "${goBin}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set Windows application metadata
        shell: pwsh
        run: |
          $path = "wails.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $config.Info) { $config | Add-Member -MemberType NoteProperty -Name Info -Value ([pscustomobject]@{}) }
          $config.Info.companyName = "BlackLoverTech"
          $config.Info.productName = "Firecracker Studio"
          $config.Info.productVersion = $env:RELEASE_VERSION
          $config.Info.copyright = "Copyright 2026 BlackLoverTech"
          $config.Info.comments = "Firecracker microVM desktop workspace"
          $config | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Build Windows application
        shell: pwsh
        run: |
          wails build -clean -platform windows/amd64 -nsis -ldflags "-X main.version=$env:RELEASE_VERSION"
          $installer = Get-ChildItem -Path build/bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Rename-Item $installer.FullName "FirecrackerStudioInstaller.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path build/bin -Filter "*.exe" -File
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content build/bin/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-studio-${{ inputs.version }}-windows
          path: |
            build/bin/*.exe
            build/bin/SHA256SUMS.txt

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Firecracker Studio ${{ inputs.version }}
          generate_release_notes: true
          prerelease: false
          files: |
            build/bin/*.exe
            build/bin/SHA256SUMS.txt
